<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PixaSocial Outreach Dashboard</title>
<link rel="stylesheet" href="dashboard.css"/>
</head>
<body>
<div class="wrap">
<header>
<h1>PixaSocial Outreach Dashboard</h1>
<div class="sub">Maya · Justin · SEO · Every outreach logged · Updated <span id="updated"></span></div>
</header>
<div class="cards" id="cards"></div>
<div class="tabs" id="tabs"></div>
<div class="filters" id="filters">
<label>Status
<select id="f-status"><option value="">All</option></select>
</label>
<label>Agent
<select id="f-agent"><option value="">All</option></select>
</label>
<label>Region
<select id="f-region"><option value="">All</option></select>
</label>
<label>Campaign
<select id="f-campaign"><option value="">All</option></select>
</label>
<label>From date
<input type="date" id="f-from"/>
</label>
<label>To date
<input type="date" id="f-to"/>
</label>
<label class="search">Search name / email / subject / notes
<input type="search" id="f-q" placeholder="Type to filter…"/>
</label>
</div>
<div class="meta-bar" id="meta"></div>
<div id="table"></div>
</div>
<script src="dashboard.js"></script>
<script>
/* Recompute status/tab cards from loaded rows (meta totals can be stale when using shards). */
(function waitBoot(){
  if (!window.DATA || !Array.isArray(DATA.rows) || !DATA.rows.length) {
    return setTimeout(waitBoot, 200);
  }
  const by_tab = {}, by_status = {}, by_agent = {};
  for (const r of DATA.rows) {
    const tab = r.tab || '';
    const st = String(r.status || 'sent').toLowerCase();
    const ag = r.agent || '';
    if (tab) by_tab[tab] = (by_tab[tab] || 0) + 1;
    by_status[st] = (by_status[st] || 0) + 1;
    if (ag) by_agent[ag] = (by_agent[ag] || 0) + 1;
  }
  DATA.totals = { all: DATA.rows.length, by_tab, by_status, by_agent };
  if (typeof renderCards === 'function') renderCards();
  if (typeof renderTabs === 'function') renderTabs();
})();
</script>
</body>
</html>
