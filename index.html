<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PixaSocial Outreach Dashboard</title>
<link rel="stylesheet" href="dashboard.css"/>
</head>
<body>
<div class="wrap">
<header>
<h1>PixaSocial Outreach Dashboard</h1>
<div class="sub">Maya · Justin · SEO · Every outreach logged · Updated <span id="updated"></span></div>
</header>
<div class="cards" id="cards"></div>
<div class="tabs" id="tabs"></div>
<div class="filters" id="filters">
<label>Status
<select id="f-status"><option value="">All</option></select>
</label>
<label>Agent
<select id="f-agent"><option value="">All</option></select>
</label>
<label>Region
<select id="f-region"><option value="">All</option></select>
</label>
<label>Campaign
<select id="f-campaign"><option value="">All</option></select>
</label>
<label>From date
<input type="date" id="f-from"/>
</label>
<label>To date
<input type="date" id="f-to"/>
</label>
<label class="check">Has website
<input type="checkbox" id="f-website"/>
</label>
<label class="check" id="f-live-only-wrap" style="display:none">Live links only
<input type="checkbox" id="f-live-only"/>
</label>
<label class="search">Search name / email / subject / notes
<input type="search" id="f-q" placeholder="Type to filter…"/>
</label>
</div>
<div class="meta-bar" id="meta"></div>
<div id="table"></div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
