<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixaSocial Outreach Tracker</title><style>:root{--bg:#0f1115;--card:#1a1d24;--muted:#9aa3b2;--text:#eef1f6;--line:#2a2f3a;--accent:#7a2be2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:20px}h1{margin:0 0 6px;font-size:22px}.sub,.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.num{font-size:24px;font-weight:700}.lab{color:var(--muted);font-size:10px;text-transform:uppercase}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab,select,input{background:#12151b;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px}.tab{cursor:pointer}.tab.active{background:var(--accent)}.table{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase}a{color:#b794f6}.notes{max-width:360px;color:var(--muted);font-size:11px}@media(max-width:800px){.cards{grid-template-columns:repeat(3,1fr)}} </style></head><body><main><h1>PixaSocial Outreach Tracker</h1><div class="sub">Justin + Maya · every send &amp; reply · Updated <span id="updated"></span> · <span id="count"></span></div><div id="cards" class="cards"></div><div id="tabs" class="tabs"></div><div class="filters"><input id="q" placeholder="Search email, company, subject, name…"><select id="status"><option value="">All statuses</option><option>sent</option><option>replied</option><option>ooo</option><option>bounced</option><option>blocked</option><option>auto-ack</option></select><select id="owner"><option value="">All owners</option><option>Justin</option><option>Maya</option></select><label class="muted">From <input type="date" id="from"></label><label class="muted">To <input type="date" id="to"></label><label class="muted"><input type="checkbox" id="link"> Has website/link</label></div><div id="err" class="muted"></div><div id="table"></div></main><script>let D,track='all';const order=['all','justin-customer','maya-agency','maya-affiliate','maya-distribution','maya-africa','maya-latam','maya-institutional','other'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),url=u=>{u=String(u||'').trim();return u?(/^https?:\/\//i.test(u)?u:'https://'+u):''};async function gz(s){let b=atob(s.replace(/\s/g,'')),a=Uint8Array.from(b,c=>c.charCodeAt(0)),r=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();return JSON.parse(new TextDecoder().decode(r))}function filt(){let q=$('q').value.toLowerCase(),st=$('status').value,ow=$('owner').value,fr=$('from').value,to=$('to').value,lk=$('link').checked;return D.activities.filter(a=>(track==='all'||a.track===track)&&(!st||a.status===st)&&(!ow||a.owner===ow)&&(!fr||a.date>=fr)&&(!to||a.date.slice(0,10)<=to)&&(!lk||(a.website||a.live_url||a.live_link||a.listing_url))&&(!q||Object.values(a).join(' ').toLowerCase().includes(q)))}function render(){let a=filt(),s=D.summary||{},bo=s.by_owner||{};$('updated').textContent=D.updated_at||'';$('count').textContent=a.length+' shown';$('cards').innerHTML=[['Activities',s.total_activities],['Outbound',s.outbound],['Replies',s.replies],['Reply rate',(s.reply_rate_pct??'—')+'%'],['Justin',bo.Justin],['Maya',bo.Maya]].map(x=>`<div class="card"><div class="num">${x[1]||0}</div><div class="lab">${x[0]}</div></div>`).join('');let by=s.by_track||{};$('tabs').innerHTML=order.filter(t=>(D.tracks||[]).includes(t)).map(t=>`<button class="tab ${t===track?'active':''}" data-t="${t}">${esc((D.tab_labels||{})[t]||t)} (${t==='all'?s.total_activities||0:by[t]||0})</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{track=b.dataset.t;render()});$('table').innerHTML='<div class="table"><table><thead><tr>'+['Date','Status','Owner / Track','Name / Company','Email','Website','Live link','Subject','Geo','Notes'].map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+a.map(x=>{let w=url(x.website),l=url(x.live_url||x.live_link||x.listing_url);return`<tr><td>${esc(x.date||'')}</td><td>${esc(x.status||'')}<div class="muted">${esc(x.direction||'')}</div></td><td>${esc(x.owner)}<div class="muted">${esc((D.tab_labels||{})[x.track]||x.track)}</div></td><td>${esc(x.name)}<div class="muted">${esc(x.company)}</div></td><td><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></td><td>${w?`<a href="${esc(w)}" target="_blank">${esc(w.replace(/^https?:\/\//,''))}</a>`:'—'}</td><td>${l?`<a href="${esc(l)}" target="_blank">${esc(l.replace(/^https?:\/\//,''))}</a>`:'—'}</td><td>${esc(x.subject)}</td><td>${esc(x.geo)}</td><td class="notes">${esc(x.notes)}</td></tr>`}).join('')+'</tbody></table></div>'}['q','status','owner','from','to','link'].forEach(id=>$(id).oninput=render);(async()=>{try{let m=await fetch('data/meta.json').then(r=>r.json()),p=await fetch('data/'+m.chunk_files[0]).then(r=>r.text());D=Object.assign(await gz(p),m);render()}catch(e){$('err').textContent='Failed to load tracker data: '+e.message}})();</script></body></html>
