<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Justin Outreach Board</title><style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--text:#eef1f6;--muted:#9aa3b2;--accent:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,-apple-system,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.sub,.muted{color:var(--muted)}h1{margin:0 0 5px;font-size:22px}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;min-width:125px}.n{font-size:22px;font-weight:700}.l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filters input,.filters select{background:#12151b;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px}.filters input[type=search]{min-width:240px;flex:1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px}th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#151821;position:sticky;top:0}a{color:#b794f6;text-decoration:none}.badge{padding:2px 7px;border-radius:99px;background:#26344e;color:#bfdbfe;font-size:10px}.status-replied{background:#173b28;color:#86efac}.empty{padding:22px;color:var(--muted)}tr{border-left:3px solid var(--accent)}
</style></head><body><main class="wrap"><h1>Justin Outreach Board</h1><div class="sub">Justin customer outreach · public read-only board · <span id="updated"></span> · <span id="count"></span></div><div id="cards" class="cards"></div><div class="filters"><input id="q" type="search" placeholder="Search name, company, email, website…"><select id="status"><option value="">All statuses</option><option>sent</option><option>replied</option><option>ooo</option><option>bounced</option><option>blocked</option><option>auto-ack</option></select><input id="from" type="date"><input id="to" type="date"></div><div id="table"><div class="empty">Loading…</div></div></main>
<script>window.__EMBEDDED_GZ_B64__="";</script><script>
const CDN='https://cdn.jsdelivr.net/gh/pixa-social/pixasocial-outreach-dashboard@main/';let DATA=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>{u=String(u||'').trim();return u?/^https?:\/\//i.test(u)?u:'https://'+u:''};
async function gzipB64(s){const b=atob(s.trim()),a=Uint8Array.from(b,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()));}
async function load(){const m=await fetch(CDN+'parts/meta.json',{cache:'no-store'}).then(r=>r.json());document.getElementById('updated').textContent=m.updated_at||m.updated_at_ist||'';const xs=await Promise.all((m.chunk_files||[]).map(async f=>{const t=await fetch(CDN+'parts/'+f,{cache:'no-store'}).then(r=>r.text());if(f.endsWith('.hex')){const a=Uint8Array.from((t.match(/[0-9a-f]{2}/gi)||[]),x=>parseInt(x,16));return JSON.parse(new TextDecoder().decode(await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()));}return gzipB64(t)}));DATA=xs.flat().map(a=>({date:a.d||a.date||'',status:a.st||a.status||'',owner:a.o||a.owner||'',track:a.tr||a.track||'',name:a.n||a.name||'',company:a.c||a.company||'',email:a.e||a.email||'',website:a.w||a.website||'',live:a.lu||a.live_url||a.live_link||'',subject:a.s||a.subject||'',geo:a.g||a.geo||'',notes:a.note||a.notes||''})).filter(a=>!a.owner||a.owner==='Justin');render();}
function render(){const q=document.getElementById('q').value.toLowerCase(),st=document.getElementById('status').value,fr=document.getElementById('from').value,to=document.getElementById('to').value;const rows=DATA.filter(a=>(!st||a.status===st)&&(!fr||a.date>=fr)&&(!to||a.date.slice(0,10)<=to)&&(!q||Object.values(a).join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent=rows.length+' shown';document.getElementById('cards').innerHTML='<div class="card"><div class="n">'+DATA.length+'</div><div class="l">Justin activities</div></div><div class="card"><div class="n">'+DATA.filter(a=>a.status==='replied').length+'</div><div class="l">Replies</div></div>';if(!rows.length){document.getElementById('table').innerHTML='<div class="empty">No matching activities.</div>';return}document.getElementById('table').innerHTML='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Status</th><th>Name / Company</th><th>Email</th><th>Website</th><th>Live link</th><th>Subject</th><th>Geo</th><th>Notes</th></tr></thead><tbody>'+rows.map(a=>'<tr><td>'+esc(a.date)+'</td><td><span class="badge '+(a.status==='replied'?'status-replied':'')+'">'+esc(a.status)+'</span></td><td>'+esc(a.name)+'<div class="muted">'+esc(a.company)+'</div></td><td><a href="mailto:'+esc(a.email)+'">'+esc(a.email)+'</a></td><td>'+ (url(a.website)?'<a target="_blank" rel="noopener" href="'+esc(url(a.website))+'">'+esc(a.website)+'</a>':'—')+'</td><td>'+ (url(a.live)?'<a target="_blank" rel="noopener" href="'+esc(url(a.live))+'">open</a>':'—')+'</td><td>'+esc(a.subject)+'</td><td>'+esc(a.geo)+'</td><td class="muted">'+esc(a.notes)+'</td></tr>').join('')+'</tbody></table></div>'}
['q','status','from','to'].forEach(id=>document.getElementById(id).addEventListener('input',render));load().catch(e=>document.getElementById('table').innerHTML='<div class="empty">Failed to load board data: '+esc(e.message)+'</div>');
</script></body></html>
